<title>하루 칭찬 포인트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen app. Portrait: sticker title, counters, snap carousel (one 20-grape bunch per screen), numbered pager.
   Landscape iPad: title + counters + pager in a left column, the bunch carousel fills the right. */
:root{
  --bg:#EEF5E6;          /* pale vineyard leaf */
  --card:#FFFFFF;
  --ink:#3B2A4A;         /* deep grape ink */
  --soft:#7D6E8A;
  --grape:#8A4FC2;       /* ripe grape */
  --grape-hi:#C9A2F0;
  --grape-lo:#5E2D92;
  --unripe:#E6D9F5;      /* empty grape: pale, not yet ripe */
  --unripe-hi:#F8F3FE;
  --unripe-lo:#CBB3E8;
  --used:#D5CEDC;
  --used-lo:#ADA2B8;
  --used-ink:#857A92;
  --leaf:#5FA84B;
  --leaf-lo:#3F7E30;
  --stem:#8B6A45;
  --sun:#FFC845;
  --tangerine:#FF9440;
  --pink:#FF79A8;
  --danger:#E0565B;
  --bee-ink:#4A3426;
  --shadow:rgba(80,40,120,.18);
  --scrim:rgba(40,25,55,.45);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --g:90px;              /* grape size, set from the carousel's size by script */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1824;--card:#2A2334;--ink:#F3EAFB;--soft:#B9A9C9;
  --grape:#A56BE0;--grape-hi:#DABDF7;--grape-lo:#6B36A3;
  --unripe:#43375A;--unripe-hi:#5E4F78;--unripe-lo:#322845;
  --used:#3E3748;--used-lo:#2F2938;--used-ink:#8D8299;
  --leaf:#6FBE59;--leaf-lo:#4C8F3B;--stem:#A88660;--sun:#FFD36B;--tangerine:#FFA866;--pink:#FF8DB6;--danger:#F07075;
  --shadow:rgba(0,0,0,.4);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1824;--card:#2A2334;--ink:#F3EAFB;--soft:#B9A9C9;
  --grape:#A56BE0;--grape-hi:#DABDF7;--grape-lo:#6B36A3;
  --unripe:#43375A;--unripe-hi:#5E4F78;--unripe-lo:#322845;
  --used:#3E3748;--used-lo:#2F2938;--used-ink:#8D8299;
  --leaf:#6FBE59;--leaf-lo:#4C8F3B;--stem:#A88660;--sun:#FFD36B;--tangerine:#FFA866;--pink:#FF8DB6;--danger:#F07075;
  --shadow:rgba(0,0,0,.4);--scrim:rgba(0,0,0,.6);color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;overflow:hidden;
  background-image:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--leaf) 14%,transparent) 0 120px,transparent 121px);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(40px,calc(env(safe-area-inset-left,0px) + 24px));padding-right:max(40px,calc(env(safe-area-inset-right,0px) + 24px))}
.app{position:relative;z-index:1;height:100%;max-width:1100px;margin:0 auto;padding-block:12px 46px;box-sizing:border-box;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:10px;
  grid-template-areas:"hero" "stats" "slider" "pager" "foot"}

/* ---------- sticker title ---------- */
.hero{grid-area:hero;margin:0;padding-top:clamp(22px,3vw,34px);display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,20px);font-weight:400}
.haru{position:relative;flex:none;width:clamp(96px,15vw,132px);aspect-ratio:1;max-width:100%;border-radius:50%;
  display:grid;place-items:center;font-family:var(--display);font-size:clamp(34px,5.4vw,48px);color:#fff;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.85) 0 8%,transparent 9%),
             radial-gradient(circle at 36% 32%,var(--grape-hi),var(--grape) 50%,var(--grape-lo));
  box-shadow:0 0 0 5px var(--card),0 8px 0 5px var(--shadow);transform:rotate(-8deg);
  text-shadow:0 3px 0 rgba(0,0,0,.18);animation:bob 3.2s ease-in-out infinite}
.haru svg{position:absolute;top:-34%;left:42%;width:58%;height:auto;overflow:visible}
.haru .cheek{position:absolute;bottom:22%;width:16%;height:9%;border-radius:50%;background:var(--pink);opacity:.75}
.haru .cheek.l{left:14%}.haru .cheek.r{right:14%}
.word{display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em;row-gap:0;font-family:var(--display);
  font-size:clamp(50px,9vw,92px);line-height:1.05;min-width:0}
.word>span{white-space:nowrap}
.ch{display:inline-block;
  text-shadow:3px 0 0 var(--card),-3px 0 0 var(--card),0 3px 0 var(--card),0 -3px 0 var(--card),
              2px 2px 0 var(--card),-2px 2px 0 var(--card),2px -2px 0 var(--card),-2px -2px 0 var(--card),0 7px 0 var(--shadow);
  animation:hop 2.8s ease-in-out infinite}
.ch:nth-child(1){color:var(--grape);transform:rotate(-6deg)}
.ch:nth-child(2){color:var(--pink);transform:rotate(5deg) translateY(4px);animation-delay:.15s}
.ch:nth-child(3){color:var(--tangerine);transform:rotate(-4deg);animation-delay:.3s}
.w2 .ch:nth-child(1){color:var(--leaf);transform:rotate(4deg) translateY(3px);animation-delay:.45s}
.w2 .ch:nth-child(2){color:var(--grape);transform:rotate(-5deg);animation-delay:.6s}
.w2 .ch:nth-child(3){color:var(--pink);transform:rotate(6deg) translateY(4px);animation-delay:.75s}
.sparkle{color:var(--sun);font-size:.42em;align-self:flex-start;animation:twinkle 2.4s ease-in-out infinite}

/* ---------- counters ---------- */
.stats{grid-area:stats;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--card);border-radius:28px;padding:8px 18px;display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 0 var(--shadow);font-family:var(--display);font-size:20px}
.stat b{font-weight:400;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.stat .dot{width:26px;height:26px;border-radius:50%;flex:none;box-sizing:border-box}
.stat.have .dot{background:radial-gradient(circle at 35% 30%,var(--grape-hi),var(--grape) 55%,var(--grape-lo))}
.stat.have b{color:var(--grape)}
.stat.used .dot{background:radial-gradient(circle at 35% 30%,var(--used),var(--used-lo))}
.stat.all .dot{background:var(--sun)}

/* ---------- carousel ---------- */
.slider{grid-area:slider;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;scrollbar-width:none;margin-inline:-8px;-webkit-overflow-scrolling:touch}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;padding:4px 8px 12px;box-sizing:border-box;min-width:0}
.vine{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:6px;right:6px;font-family:var(--display);font-size:20px;background:var(--sun);color:#3B2A4A;border-radius:999px;padding:6px 14px;z-index:2}
.cluster{position:relative;display:flex;flex-direction:column;align-items:center}
.cluster>svg{width:calc(var(--g)*3.4);height:auto;margin-bottom:calc(var(--g)*-0.32);position:relative;z-index:1;pointer-events:none;overflow:visible}
.bunch{display:flex;flex-direction:column;align-items:center;position:relative;z-index:0}
.row{display:flex;gap:calc(var(--g)*0.03);justify-content:center}
.row+.row{margin-top:calc(var(--g)*-0.13)}

/* ---------- grapes ---------- */
.grape{width:var(--g);height:var(--g);border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;box-sizing:border-box;
  font-family:var(--display);display:grid;place-items:center;color:inherit;
  box-shadow:0 0 0 calc(var(--g)*0.035) var(--card);
  transition:transform .15s ease;touch-action:manipulation;-webkit-touch-callout:none}
.grape::after{content:"";position:absolute;left:22%;top:16%;width:22%;height:15%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-30deg);pointer-events:none}
.grape:active{transform:scale(.92)}
.grape.pressing{transform:scale(.8);transition:transform .55s ease-in}
.grape:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.grape.empty{background:radial-gradient(circle at 38% 34%,var(--unripe-hi),var(--unripe) 55%,var(--unripe-lo));
  box-shadow:0 0 0 calc(var(--g)*0.035) var(--card),inset -5px -7px 0 rgba(90,50,140,.07);color:var(--unripe-lo)}
.grape.empty::after{background:rgba(255,255,255,.55)}
.grape.empty .face{font-size:calc(var(--g)*0.34);opacity:.9;color:var(--grape-hi)}
.grape.on{background:radial-gradient(circle at 36% 30%,var(--grape-hi) 0 10%,var(--grape) 48%,var(--grape-lo) 100%);
  box-shadow:0 0 0 calc(var(--g)*0.035) var(--card),inset -6px -8px 0 rgba(0,0,0,.12);color:#fff}
.grape .face{pointer-events:none;line-height:1;position:relative;z-index:1}
.grape.on .face{font-size:calc(var(--g)*0.3);text-shadow:0 2px 0 rgba(0,0,0,.15);margin-top:calc(var(--g)*0.08)}
.grape.used{background:radial-gradient(circle at 36% 30%,var(--used) 0 40%,var(--used-lo) 100%);color:var(--used-ink)}
.grape.used::after{background:rgba(255,255,255,.4)}
.grape.used .face{font-size:calc(var(--g)*0.34)}
.grape.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

.pager{grid-area:pager;display:flex;gap:10px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;min-width:0}
.pager::-webkit-scrollbar{display:none}
.pg{flex:none;min-width:52px;height:52px;border-radius:26px;border:0;font-family:var(--display);font-size:24px;cursor:pointer;
  background:var(--card);color:var(--soft);box-shadow:0 3px 0 var(--shadow);font-variant-numeric:tabular-nums;touch-action:manipulation}
.pg.done{background:var(--unripe);color:var(--grape)}
.pg.cur{background:var(--grape);color:#fff;transform:scale(1.08)}
.foot{grid-area:foot;display:flex;justify-content:center;gap:4px 16px;flex-wrap:wrap;font-size:15px;color:var(--soft);text-align:center}

/* landscape iPad: side column */
@media (min-aspect-ratio:5/4) and (min-width:900px){
  .app{grid-template-columns:minmax(260px,30%) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:18px;
    grid-template-areas:"hero slider" "stats slider" ". slider" "pager slider" "foot slider"}
  .hero{flex-direction:column;gap:14px;padding-top:44px}
  .sparkle{display:none}
  .word{font-size:clamp(54px,6.4vw,80px);flex-direction:column;align-items:center}
  .stats{flex-direction:column;align-items:stretch}
  .stat{justify-content:space-between}
  .pager{flex-wrap:wrap}
  .foot{flex-direction:column;font-size:14px}
}

/* ---------- border vines ---------- */
.vines{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vines .vs{fill:none;stroke:var(--leaf-lo);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.vines .lf{fill:var(--leaf)}
.vines .vn{fill:none;stroke:var(--leaf-lo);stroke-width:1.6;stroke-linecap:round}
.vines .tw{fill:none;stroke:var(--leaf);stroke-width:2.6;stroke-linecap:round}
.vines .gp{fill:var(--grape)}
.vines .gh{fill:var(--grape-hi)}

/* ---------- bee ---------- */
.bee{position:fixed;left:0;top:0;width:92px;height:82px;z-index:15;pointer-events:none;will-change:transform}
.bee svg{width:100%;height:100%;overflow:visible;transition:transform .2s}
.bee .body{fill:var(--sun)}
.bee .ink{fill:var(--bee-ink)}
.bee .line{fill:none;stroke:var(--bee-ink);stroke-width:2.4;stroke-linecap:round}
.bee .cheek{fill:var(--pink);opacity:.8}
.bee .eye-hi{fill:#fff}
.bee .wing{fill:rgba(255,255,255,.85);stroke:var(--grape-hi);stroke-width:1.5;transform-box:fill-box;transform-origin:50% 100%;animation:flap .11s ease-in-out infinite alternate}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--card);color:var(--grape-lo);font-family:var(--display);font-size:28px;padding:10px 20px;border-radius:24px;
  box-shadow:0 5px 0 var(--shadow);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--card)}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:40px;padding:28px 24px;width:min(640px,100%);display:flex;flex-direction:column;gap:20px;
  animation:rise .25s ease-out;max-height:100%;overflow:auto;box-sizing:border-box}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;text-align:center;text-wrap:balance}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choices.one{grid-template-columns:minmax(0,1fr)}
.choice{font-family:var(--display);font-size:clamp(22px,3.6vw,28px);border:0;border-radius:28px;padding:18px 10px;min-height:120px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  background:var(--unripe);color:var(--ink);box-shadow:0 5px 0 var(--shadow);touch-action:manipulation}
.choice .ic{font-size:48px;line-height:1}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.choice.go{background:var(--grape);color:#fff}
.choice.del{background:var(--danger);color:#fff}
.btn{font-family:var(--display);font-size:22px;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;align-self:center;
  background:var(--unripe);color:var(--ink);box-shadow:0 4px 0 var(--shadow);touch-action:manipulation}

.burst{position:fixed;pointer-events:none;z-index:30;font-family:var(--display);font-size:44px;color:var(--grape);
  animation:float 1.1s ease-out forwards;text-shadow:0 3px 0 var(--card)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;
  background:var(--ink);color:var(--bg);font-family:var(--display);font-size:22px;padding:14px 26px;border-radius:999px;
  box-shadow:0 6px 20px var(--shadow);max-width:calc(100% - 32px);text-align:center;pointer-events:none}

@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes float{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
@keyframes twinkle{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.2)}}
@keyframes bob{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-5px)}}
@keyframes hop{0%,80%,100%{translate:0 0}88%{translate:0 -8px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.choice{min-height:96px}.choice .ic{font-size:38px}.stat b{font-size:26px}.stat{font-size:16px;padding:8px 12px}
  .badge{font-size:16px}
  body{padding-left:max(30px,calc(env(safe-area-inset-left,0px) + 18px));padding-right:max(30px,calc(env(safe-area-inset-right,0px) + 18px))}}
</style>

<svg class="vines" id="vines" aria-hidden="true"></svg>
<div class="bee" id="bee" aria-hidden="true" hidden>
  <div class="bubble" id="beeBubble" hidden>하루야 잘했어!</div>
  <svg id="beeSvg" viewBox="0 0 80 70">
    <ellipse class="wing" cx="34" cy="14" rx="11" ry="15"/>
    <ellipse class="wing" cx="48" cy="16" rx="9" ry="13"/>
    <path class="ink" d="M15 40 L3 45 L15 50Z"/>
    <clipPath id="beeClip"><ellipse cx="40" cy="45" rx="26" ry="20"/></clipPath>
    <ellipse class="body" cx="40" cy="45" rx="26" ry="20"/>
    <g clip-path="url(#beeClip)"><rect class="ink" x="22" y="20" width="7" height="50"/><rect class="ink" x="35" y="20" width="7" height="50"/></g>
    <path class="line" d="M54 28 Q56 16 62 10"/><circle class="ink" cx="62" cy="10" r="3.2"/>
    <path class="line" d="M58 30 Q64 20 71 17"/><circle class="ink" cx="71" cy="17" r="3.2"/>
    <circle class="ink" cx="55" cy="40" r="3.6"/><circle class="eye-hi" cx="56.2" cy="38.8" r="1.2"/>
    <circle class="ink" cx="64" cy="41" r="3.2"/><circle class="eye-hi" cx="65" cy="39.9" r="1.1"/>
    <path class="line" d="M56 48 Q60 52 64 48"/>
    <ellipse class="cheek" cx="52" cy="48" rx="3.6" ry="2.4"/><ellipse class="cheek" cx="67" cy="48" rx="3" ry="2.2"/>
  </svg>
</div>
<div class="app">
  <h1 class="hero" aria-label="하루 칭찬 포인트">
    <span class="haru" aria-hidden="true">
      <svg viewBox="0 0 60 44"><path d="M10 40 C12 24 18 14 28 8" stroke="var(--stem)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M26 10 C34 -2 54 0 58 12 C46 22 32 20 26 10Z" fill="var(--leaf)"/>
        <path d="M28 10 C38 9 48 10 56 12" stroke="var(--leaf-lo)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      하루
      <i class="cheek l"></i><i class="cheek r"></i>
    </span>
    <span class="word" aria-hidden="true">
      <span class="w1"><span class="ch">칭</span><span class="ch">찬</span></span>
      <span class="w2"><span class="ch">포</span><span class="ch">인</span><span class="ch">트</span></span>
      <span class="sparkle">★</span>
    </span>
  </h1>

  <div class="stats" aria-live="polite">
    <div class="stat have"><span class="dot"></span>쓸 수 있어요 <b id="nHave">0</b></div>
    <div class="stat used"><span class="dot"></span>썼어요 <b id="nUsed">0</b></div>
    <div class="stat all"><span class="dot"></span>모은 칭찬 <b id="nAll">0</b></div>
  </div>

  <div class="slider" id="slider" aria-label="포도송이들"></div>
  <div class="pager" id="pager" aria-label="포도송이 번호"></div>
  <div class="foot"><span>빈 포도알 누르기 = 칭찬 +1</span><span>보라 포도알 누르기 = 포인트 쓰기</span><span>꾹 누르기 = 지우기</span><span id="status"></span></div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div class="choices" id="choices"></div>
    <button class="btn" id="cancel">취소</button>
  </div>
</div>

<script>
(function(){
  const ROWS=[5,6,5,3,1];               // 20 grapes, wide shoulders tapering to a point
  const TOTAL=ROWS.reduce((a,b)=>a+b,0);
  const DEEDS=[
    {k:"toy",ic:"🧸",t:"장난감 정리"},
    {k:"hangul",ic:"✏️",t:"한글 쓰기"},
    {k:"meal",ic:"🍚",t:"밥 잘 먹기"},
    {k:"etc",ic:"⭐",t:"다른 착한 일"}];
  const USES=[
    {k:"video",ic:"📺",t:"영상 보기"},
    {k:"game",ic:"🎮",t:"게임 하기"},
    {k:"treat",ic:"🍭",t:"간식 먹기"},
    {k:"etc",ic:"🎁",t:"다른 데 쓰기"}];
  const FACES=["◕‿◕","^‿^","•ᴗ•","◠‿◠"];
  const LS="haru-point-v2", LS_OLD="haru-point-v1";
  // stem, big leaf, small leaf and a curly tendril sitting on top of the bunch
  const SVG_TOP='<svg viewBox="0 0 200 92" aria-hidden="true">'+
    '<path d="M100 92 C100 70 102 52 112 34" stroke="var(--stem)" stroke-width="10" fill="none" stroke-linecap="round"/>'+
    '<path d="M110 36 C88 4 40 4 22 30 C30 44 58 56 86 50 C98 47 106 42 110 36Z" fill="var(--leaf)"/>'+
    '<path d="M108 37 C84 34 58 34 32 32 M70 35 C64 26 58 20 50 16 M86 36 C84 46 78 50 70 52" stroke="var(--leaf-lo)" stroke-width="3.5" fill="none" stroke-linecap="round"/>'+
    '<path d="M112 34 C126 12 160 8 176 24 C164 40 134 44 112 34Z" fill="var(--leaf)"/>'+
    '<path d="M114 34 C134 28 152 26 170 25" stroke="var(--leaf-lo)" stroke-width="3" fill="none" stroke-linecap="round"/>'+
    '<path d="M118 46 c18 2 26 16 16 26 c-9 9 -22 0 -14 -9 c5 -5 12 -1 10 4" stroke="var(--leaf)" stroke-width="4.5" fill="none" stroke-linecap="round"/>'+
    '</svg>';

  const $=id=>document.getElementById(id);
  const clone=o=>JSON.parse(JSON.stringify(o));
  const newBunch=()=>({cells:Array.from({length:TOTAL},()=>({s:0}))});
  const isFull=b=>b.cells.every(c=>c.s!==0);

  // Accepts any saved shape (older 30-grape bunches too) and repacks it into 20-grape bunches.
  function normalize(v){
    if(!v)return null;
    let bunches=null;
    if(Array.isArray(v.bunches))bunches=v.bunches.filter(b=>b&&Array.isArray(b.cells));
    else if(Array.isArray(v.cells))bunches=[{cells:v.cells}];
    if(!bunches||!bunches.length)return null;
    if(bunches.some(b=>b.cells.length!==TOTAL)){
      const filled=[];bunches.forEach(b=>b.cells.forEach(c=>{if(c&&c.s)filled.push(c)}));
      bunches=[];
      for(let i=0;i<filled.length;i+=TOTAL){const nb=newBunch();filled.slice(i,i+TOTAL).forEach((c,j)=>nb.cells[j]=c);bunches.push(nb)}
      if(!bunches.length)bunches.push(newBunch());
    }
    if(isFull(bunches[bunches.length-1]))bunches.push(newBunch());
    return {bunches:bunches};
  }
  function load(){
    for(const k of [LS,LS_OLD]){try{const v=normalize(JSON.parse(localStorage.getItem(k)));if(v)return v}catch(e){}}
    return null;
  }
  function cache(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}

  let state=load()||{bunches:[newBunch()]};
  let ref=null, toastTimer=null, cur=state.bunches.length-1;
  const slider=$("slider"), pager=$("pager");

  /* ---------- sizing: one bunch fits the screen ---------- */
  function fit(){
    const w=slider.clientWidth-16, h=slider.clientHeight-16;
    // width: 6 grapes; height: leaf (~0.6g) + 5 overlapping rows (~4.5g) + room for the number label
    const g=Math.max(36,Math.min(w/6.4,h/5.3,150));
    document.documentElement.style.setProperty("--g",g.toFixed(1)+"px");
  }
  new ResizeObserver(()=>{fit();goTo(cur,false)}).observe(slider);

  /* ---------- render ---------- */
  function render(pop){
    const nb=state.bunches.length;
    while(slider.children.length<nb){const s=document.createElement("div");s.className="slide";slider.appendChild(s)}
    while(slider.children.length>nb)slider.lastChild.remove();
    state.bunches.forEach((b,bi)=>{
      const slide=slider.children[bi];
      const full=isFull(b);
      const vine=document.createElement("div");vine.className="vine"+(full?" done":"");
      if(full){const bd=document.createElement("div");bd.className="badge";bd.textContent="다 채웠어요! 🎉";vine.appendChild(bd)}
      const cluster=document.createElement("div");cluster.className="cluster";
      cluster.insertAdjacentHTML("afterbegin",SVG_TOP);
      const bunch=document.createElement("div");bunch.className="bunch";
      let i=0;
      ROWS.forEach(n=>{
        const row=document.createElement("div");row.className="row";
        for(let j=0;j<n;j++,i++)row.appendChild(grapeEl(bi,i,pop&&pop[0]===bi&&pop[1]===i));
        bunch.appendChild(row);
      });
      cluster.appendChild(bunch);vine.appendChild(cluster);
      slide.replaceChildren(vine);
      slide.setAttribute("aria-label",(bi+1)+"번째 포도송이");
    });
    pager.textContent="";
    state.bunches.forEach((b,bi)=>{
      const p=document.createElement("button");p.className="pg"+(isFull(b)?" done":"")+(bi===cur?" cur":"");
      p.textContent=bi+1;p.setAttribute("aria-label",(bi+1)+"번째 포도송이로 가기");
      p.addEventListener("click",()=>goTo(bi,true));pager.appendChild(p);
    });
    let have=0,used=0;state.bunches.forEach(b=>b.cells.forEach(c=>{if(c.s===1)have++;else if(c.s===2)used++}));
    $("nHave").textContent=have;$("nUsed").textContent=used;$("nAll").textContent=have+used;
  }

  function grapeEl(bi,i,pop){
    const c=state.bunches[bi].cells[i];
    const el=document.createElement("button");
    el.className="grape "+(c.s===1?"on":c.s===2?"used":"empty")+(pop?" pop":"");
    const face=document.createElement("span");face.className="face";
    face.textContent=c.s===1?FACES[i%FACES.length]:c.s===2?"✓":"+";
    el.setAttribute("aria-label",(i+1)+"번 포도알: "+(c.s===1?"칭찬 포인트 있음":c.s===2?"사용함":"비어 있음"));
    el.appendChild(face);
    bindPress(el,()=>tap(bi,i,el),()=>longPress(bi,i));
    return el;
  }

  /* ---------- tap vs long press ---------- */
  function bindPress(el,onTap,onLong){
    let timer=null,fired=false,x=0,y=0;
    const clear=()=>{clearTimeout(timer);timer=null;el.classList.remove("pressing")};
    el.addEventListener("pointerdown",e=>{
      fired=false;x=e.clientX;y=e.clientY;
      if(el.classList.contains("empty"))return;
      el.classList.add("pressing");
      timer=setTimeout(()=>{fired=true;clear();if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){};onLong()},600);
    });
    el.addEventListener("pointermove",e=>{if(timer&&Math.hypot(e.clientX-x,e.clientY-y)>10)clear()});
    ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t,clear));
    el.addEventListener("contextmenu",e=>e.preventDefault());
    el.addEventListener("click",e=>{if(fired){fired=false;e.preventDefault();return}onTap()});
  }

  function tap(bi,i,el){
    const c=state.bunches[bi].cells[i];
    if(c.s===0) ask("어떤 착한 일을 했나요?",DEEDS,"",k=>change(()=>{state.bunches[bi].cells[i]={s:1,d:k,at:Date.now()}},[bi,i],el,"+1","칭찬 포인트 +1! 잘했어요!"));
    else if(c.s===1) ask("칭찬 포인트를 어디에 쓸까요?",USES,"go",k=>change(()=>{state.bunches[bi].cells[i]=Object.assign({},c,{s:2,u:k,usedAt:Date.now()})},[bi,i],el,"✓","포인트 1개를 썼어요"));
    else {const d=DEEDS.find(x=>x.k===c.d),u=USES.find(x=>x.k===c.u);
      showToast((d?d.ic+" "+d.t:"칭찬")+" → "+(u?u.ic+" "+u.t:"사용 완료"))}
  }

  function longPress(bi,i){
    const c=state.bunches[bi].cells[i];
    if(c.s===0)return;
    const opts=[{k:"del",ic:"🗑️",t:"포도알 지우기",cls:"del"}];
    if(c.s===2)opts.unshift({k:"unuse",ic:"↩️",t:"안 쓴 걸로 하기"});
    ask("잘못 눌렀나요?",opts,"",k=>{
      if(k==="del")change(()=>{state.bunches[bi].cells[i]={s:0}},null,null,null,"포도알을 지웠어요");
      else change(()=>{const n=Object.assign({},c,{s:1});delete n.u;delete n.usedAt;state.bunches[bi].cells[i]=n},[bi,i],null,null,"다시 쓸 수 있는 포인트가 됐어요");
    },opts.length===1);
  }

  function ask(title,opts,cls,done,single){
    $("sheetTitle").textContent=title;
    const box=$("choices");box.textContent="";box.classList.toggle("one",!!single);
    opts.forEach(o=>{
      const b=document.createElement("button");b.className="choice "+(o.cls||cls||"");
      const ic=document.createElement("span");ic.className="ic";ic.textContent=o.ic;
      const t=document.createElement("span");t.textContent=o.t;
      b.append(ic,t);
      b.addEventListener("click",()=>{close();done(o.k)});
      box.appendChild(b);
    });
    $("scrim").hidden=false;
  }
  function close(){$("scrim").hidden=true}
  $("cancel").addEventListener("click",close);
  $("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});

  function change(fn,pop,el,burstText,msg){
    const r=el?el.getBoundingClientRect():null;   // measure before the grape is re-rendered
    fn();
    let grew=false;
    if(isFull(state.bunches[state.bunches.length-1])){state.bunches.push(newBunch());grew=true}
    cache();render(pop);
    if(r&&burstText==="+1")praise(r);
    if(r&&burstText){const s=document.createElement("div");s.className="burst";s.textContent=burstText;
      s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top+r.height/2)+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
    save();
    if(grew){showToast("포도송이를 다 채웠어요! 🎉 새 포도송이로 가요");setTimeout(()=>goTo(state.bunches.length-1,true),1600)}
    else if(burstText!=="+1")showToast(msg);   // the bee already cheers for +1
  }

  /* ---------- carousel position ---------- */
  function goTo(bi,smooth){
    cur=Math.max(0,Math.min(bi,state.bunches.length-1));
    slider.scrollTo({left:cur*slider.clientWidth,behavior:smooth?"smooth":"auto"});
    markPager();
  }
  function markPager(){
    [...pager.children].forEach((p,i)=>p.classList.toggle("cur",i===cur));
    const p=pager.children[cur];if(p)p.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  }
  let st=null;
  slider.addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(()=>{
    const n=Math.round(slider.scrollLeft/slider.clientWidth);if(n!==cur){cur=n;markPager()}},80)},{passive:true});

  function showToast(msg){
    document.querySelectorAll(".toast").forEach(t=>t.remove());clearTimeout(toastTimer);
    const t=document.createElement("div");t.className="toast";t.textContent=msg;
    document.body.appendChild(t);toastTimer=setTimeout(()=>t.remove(),2600);
  }

  /* ---------- saving: always on this device; also synced when signed in to claude.ai ---------- */
  let saving=false,again=false;
  async function save(){
    if(!ref)return;
    if(saving){again=true;return}
    saving=true;
    try{await ref.set(clone(state));$("status").textContent="저장됨 · 다른 기기와 같이 보여요"}
    catch(e){$("status").textContent="이 아이패드에 저장됨"}
    saving=false;if(again){again=false;save()}
  }

  /* ---------- vines along the left, bottom and right edges ---------- */
  const rnd=k=>{const x=Math.sin(k*12.9898)*43758.5453;return x-Math.floor(x)};
  function drawVines(){
    const W=innerWidth,H=innerHeight,m=12,svg=$("vines");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    const segs=[[H-m,s=>[m,s],[1,0]],[W-2*m,s=>[m+s,H-m],[0,-1]],[H-m,s=>[W-m,H-m-s],[-1,0]]];
    const total=segs.reduce((a,s)=>a+s[0],0);
    const at=s=>{let o=s;for(const [len,f,n] of segs){if(o<=len){const [x,y]=f(o),w=Math.sin(s/38)*6;return {x:x+n[0]*w,y:y+n[1]*w,n}}o-=len}const l=segs[2];const [x,y]=l[1](l[0]);return {x,y,n:l[2]}};
    let d="";for(let s=0;s<=total;s+=6){const p=at(s);d+=(s?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)}
    let out='<path class="vs" d="'+d+'"/>';
    let k=0;
    for(let s=30;s<total-10;s+=58,k++){
      const p=at(s),a=Math.atan2(p.n[1],p.n[0])*180/Math.PI,side=k%2?1:-1,sc=0.9+rnd(k)*0.5;
      out+='<g transform="translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+(a+side*48).toFixed(1)+') scale('+sc.toFixed(2)+')"><path class="lf" d="M0 0 C6 -11 22 -12 32 0 C22 12 6 11 0 0Z"/><path class="vn" d="M3 0 L27 0"/></g>';
      if(k%5===2) out+='<g transform="translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+(a-side*30).toFixed(1)+')"><path class="tw" d="M0 0 C10 -2 18 6 13 13 C9 18 1 15 4 9 C6 6 10 7 10 10"/></g>';
      if(k%7===4){const t=[-p.n[1],p.n[0]];
        [[14,-6],[14,6],[24,0],[24,-11],[24,11],[33,-5],[33,5],[41,0]].forEach(([u,v])=>{
          const cx=p.x+p.n[0]*u+t[0]*v,cy=p.y+p.n[1]*u+t[1]*v;
          out+='<circle class="gp" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="6.2"/><circle class="gh" cx="'+(cx-2).toFixed(1)+'" cy="'+(cy-2).toFixed(1)+'" r="1.8"/>'})}
    }
    svg.innerHTML=out;
  }
  drawVines();addEventListener("resize",drawVines);

  /* ---------- the bee: wanders around, flies to a new grape and cheers ---------- */
  const bee=$("bee"),beeSvg=$("beeSvg"),bubble=$("beeBubble");
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let bx=innerWidth*0.75,by=innerHeight*0.35,tx=bx,ty=by,dir=1,praising=false,praiseTimer=null,lastT=0;
  const clampX=x=>Math.max(110,Math.min(innerWidth-110,x)),clampY=y=>Math.max(110,Math.min(innerHeight-70,y));
  function pick(){tx=clampX(60+Math.random()*(innerWidth-120));ty=clampY(90+Math.random()*(innerHeight-180))}
  function place(t){
    const bob=still?0:Math.sin(t/170)*6;
    bee.style.transform="translate("+(bx-46).toFixed(1)+"px,"+(by-41+bob).toFixed(1)+"px)";
    beeSvg.style.transform="scaleX("+dir+")";
  }
  function step(t){
    const dt=Math.min(50,t-(lastT||t));lastT=t;
    const dx=tx-bx,dy=ty-by,dist=Math.hypot(dx,dy);
    if(dist<10){if(!praising)pick()}
    else{const sp=(praising?0.55:0.09)*dt;bx+=dx/dist*Math.min(sp,dist);by+=dy/dist*Math.min(sp,dist);if(Math.abs(dx)>3)dir=dx>0?1:-1}
    place(t);requestAnimationFrame(step);
  }
  bee.hidden=false;pick();
  if(still)place(0);else requestAnimationFrame(step);

  let koVoice=null;
  function findVoice(){try{koVoice=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang))||null}catch(e){}}
  if("speechSynthesis" in window){findVoice();try{speechSynthesis.addEventListener("voiceschanged",findVoice)}catch(e){}}
  function speak(text){
    try{
      const ss=window.speechSynthesis;if(!ss)return;
      ss.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang="ko-KR";if(koVoice)u.voice=koVoice;
      u.pitch=1.9;u.rate=1.05;u.volume=1;     // high and bouncy: a little bee voice
      ss.speak(u);
    }catch(e){}
  }
  function praise(r){
    const line="하루야 잘했어!";
    speak(line);
    praising=true;clearTimeout(praiseTimer);
    tx=clampX(r.left+r.width/2);ty=clampY(r.top-20);
    if(still){bx=tx;by=ty;place(0)}
    bubble.textContent=line;bubble.hidden=false;
    bubble.style.animation="none";void bubble.offsetWidth;bubble.style.animation="";
    praiseTimer=setTimeout(()=>{praising=false;bubble.hidden=true;if(!still)pick()},3000);
  }

  fit();render();goTo(cur,false);cache();
  $("status").textContent="이 아이패드에 저장됨";

  (async()=>{
    let db=null;
    try{db=window.claude&&typeof window.claude.use==="function"?await window.claude.use("db"):null}catch(e){db=null}
    if(!db)return;                       // not signed in / plain web page: keep using this device's storage
    ref=db.doc("haru/board");
    let first=true;
    ref.onSnapshot(snap=>{
      if(snap.metadata.fromCache)return;
      if(snap.exists){
        const d=normalize(snap.data());
        if(d&&!snap.metadata.hasPendingWrites){
          const atEnd=cur===state.bunches.length-1;
          state=d;cache();render();
          if(first||atEnd)goTo(state.bunches.length-1,false);
        }
      } else if(first) save();
      first=false;
      $("status").textContent="저장됨 · 다른 기기와 같이 보여요";
    },()=>{ref=null;$("status").textContent="이 아이패드에 저장됨"});
  })();
})();
</script>
